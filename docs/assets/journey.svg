<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="How GovBus works: search, pick seats, pay, get a QR e-ticket, track live">
  <title>How it works</title>
  <style>
    text { font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .bus { animation: hop 12s cubic-bezier(.45,.05,.35,1) infinite; }
    .bob { animation: bob .6s ease-in-out infinite; }
    .dash { animation: road 1s linear infinite; }
    .s1 { animation: s1 12s infinite; } .s2 { animation: s2 12s infinite; } .s3 { animation: s3 12s infinite; }
    .s4 { animation: s4 12s infinite; } .s5 { animation: s5 12s infinite; }
    .st { transform-box: fill-box; transform-origin: center; }
    @keyframes road { to { stroke-dashoffset: -40; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes hop {
      0%,8% { transform: translateX(0); opacity: 1; }
      20%,28% { transform: translateX(240px); }
      40%,48% { transform: translateX(480px); }
      60%,68% { transform: translateX(720px); }
      80%,92% { transform: translateX(960px); opacity: 1; }
      96% { transform: translateX(960px); opacity: 0; }
      97% { transform: translateX(0); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    @keyframes s1 { 0%,8% { transform: scale(1.18); filter: drop-shadow(0 0 10px #f5b301); } 12%,100% { transform: scale(1); filter: none; } }
    @keyframes s2 { 0%,18% { transform: scale(1); } 20%,28% { transform: scale(1.18); filter: drop-shadow(0 0 10px #f5b301); } 32%,100% { transform: scale(1); filter: none; } }
    @keyframes s3 { 0%,38% { transform: scale(1); } 40%,48% { transform: scale(1.18); filter: drop-shadow(0 0 10px #f5b301); } 52%,100% { transform: scale(1); filter: none; } }
    @keyframes s4 { 0%,58% { transform: scale(1); } 60%,68% { transform: scale(1.18); filter: drop-shadow(0 0 10px #f5b301); } 72%,100% { transform: scale(1); filter: none; } }
    @keyframes s5 { 0%,78% { transform: scale(1); } 80%,92% { transform: scale(1.18); filter: drop-shadow(0 0 10px #40c057); } 96%,100% { transform: scale(1); filter: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4f30"/>
      <stop offset="1" stop-color="#157347"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2f3e9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="250" rx="24" fill="url(#bg)"/>
  <rect x="80" y="120" width="1040" height="16" rx="8" fill="#0a3a24"/>
  <line class="dash" x1="80" y1="128" x2="1120" y2="128" stroke="#ffd43b" stroke-width="3" stroke-dasharray="20 20"/>

  <g class="st s1"><circle cx="120" cy="128" r="44" fill="url(#node)" stroke="#f5b301" stroke-width="4"/><text x="120" y="142" text-anchor="middle" font-size="38">🔍</text></g>
  <g class="st s2"><circle cx="360" cy="128" r="44" fill="url(#node)" stroke="#f5b301" stroke-width="4"/><text x="360" y="142" text-anchor="middle" font-size="38">💺</text></g>
  <g class="st s3"><circle cx="600" cy="128" r="44" fill="url(#node)" stroke="#f5b301" stroke-width="4"/><text x="600" y="142" text-anchor="middle" font-size="38">💳</text></g>
  <g class="st s4"><circle cx="840" cy="128" r="44" fill="url(#node)" stroke="#f5b301" stroke-width="4"/><text x="840" y="142" text-anchor="middle" font-size="38">🎫</text></g>
  <g class="st s5"><circle cx="1080" cy="128" r="44" fill="url(#node)" stroke="#40c057" stroke-width="4"/><text x="1080" y="142" text-anchor="middle" font-size="38">📍</text></g>

  <g font-weight="800" font-size="20" fill="#fff" text-anchor="middle">
    <text x="120" y="204">Search</text><text x="360" y="204">Pick seats</text><text x="600" y="204">Pay</text><text x="840" y="204">QR e-ticket</text><text x="1080" y="204">Track live</text>
  </g>
  <g font-size="14" fill="#bfe9d6" text-anchor="middle">
    <text x="120" y="226">or a route with a change</text><text x="360" y="226">live seat map</text><text x="600" y="226">mock UPI / card</text><text x="840" y="226">by SMS + email</text><text x="1080" y="226">GPS + ETA per stop</text>
  </g>
  <text x="600" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#fff" opacity=".9">From search to seat to live map in five steps</text>

  <!-- mini 3D bus -->
  <g class="bus">
    <g class="bob"><g transform="translate(78 40)">
      <polygon points="0,0 12,-7 84,-7 72,0" fill="#ffd8a8"/>
      <rect x="0" y="0" width="72" height="30" rx="4" fill="#e8590c"/>
      <rect x="5" y="5" width="52" height="11" rx="2" fill="#1b2a35"/>
      <rect x="0" y="20" width="72" height="3" fill="#f5b301"/>
      <polygon points="72,0 84,-7 84,22 72,30" fill="#a23a07"/>
      <polygon points="74,4 82,-1 82,10 74,15" fill="#1b2a35"/>
      <circle cx="16" cy="31" r="6" fill="#1b1b1b"/><circle cx="58" cy="31" r="6" fill="#1b1b1b"/>
      <circle cx="16" cy="31" r="2.5" fill="#ccc"/><circle cx="58" cy="31" r="2.5" fill="#ccc"/>
    </g></g>
  </g>
</svg>
